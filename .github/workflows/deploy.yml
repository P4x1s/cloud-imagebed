name: Deploy CloudImageBed to Cloudflare Workers

# push 到 main 自动部署；也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
    # 图床文件写入 gallery/ 目录；排除它，避免每次上传图片都触发一次 Worker 部署。
    # 源码改动（含本 workflow、wrangler.toml）仍会正常触发部署。
    paths-ignore:
      - 'gallery/**'
  workflow_dispatch:

concurrency:
  group: deploy-imagebed-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy worker
    runs-on: ubuntu-latest
    # 限制只有仓库所有者能触发，避免 fork 拿到密钥
    if: github.repository_owner == 'P4x1s'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # wrangler v4 要求 Node.js >= 22.12
          node-version: '22'

      - name: Install wrangler
        run: npm install -g wrangler@4.109.0

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，请在仓库 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
          # 关键：--keep-vars。wrangler deploy 默认会删除 Dashboard 上的全部变量，
          # GITHUB_TOKEN / ACCESS_PASSWORD 是 Dashboard Secret，不清空它们。
          echo ">>> 使用 --keep-vars 保留 Dashboard 上的变量与 Secret"
          npx wrangler deploy --config wrangler.toml --keep-vars
          npx wrangler versions list | head -20

      - name: Smoke test (版本指纹)
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          # 在仓库 Settings → Variables 里设置 WORKER_URL，如 https://cloud-imagebed.xxx.workers.dev
          if [ -z "${WORKER_URL:-}" ]; then
            echo "::notice::未配置 WORKER_URL，跳过线上自检"
            exit 0
          fi
          echo "等待 Cloudflare 边缘生效..."
          sleep 20
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/h.html -w '%{http_code}' "${WORKER_URL}/health" || echo 000)
            echo "attempt $i -> HTTP $code"
            if grep -q 'CloudImageBed' /tmp/h.html; then
              echo "::notice::线上健康检查通过，CloudImageBed 已生效 ✓"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::未能在线上确认版本指纹，请手动核对 Dashboard → Deployments"
