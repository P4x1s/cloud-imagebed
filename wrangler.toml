#: CloudImageBed — Cloudflare Workers 配置
#: 完整文档：https://developers.cloudflare.com/workers/wrangler/configuration/

#: 项目名称，同时决定 *.workers.dev 子域名前缀（占用则 Cloudflare 自动加后缀）
name = "cloud-imagebed"

#: Worker 入口（前端页面 + 后端 API 单文件）
main = "src/worker.js"

#: 兼容性日期，固定 API 行为
compatibility_date = "2026-11-18"

#: 允许把 ui.html 作为文本导入（Wrangler 内置 Text 规则）
[[rules]]
type = "Text"
globs = ["**/*.html"]
target = "esm"

#: ─────────────────────────────────────────────────────────────
#: 非敏感变量：改成你自己的值
#:   REPO        = "owner/repo"  存储用的 GitHub 仓库（现为项目本身 P4x1s/cloud-imagebed）
#:   BRANCH      = "main"        存文件的分支
#:   DIR_PREFIX  = "gallery"     图床根目录（仓库内文件夹），上传会再自动按年月分目录。
#:                               这是图床唯一写入的目录，deploy.yml 已把它排除出部署触发，
#:                               上传图片不会触发 GitHub Actions 重新部署。
#:   MAX_UPLOAD_MB = "50"        单文件大小上限（MB）；GitHub 建议 ≤50MB（硬上限 100MB），
#:                               且 base64 后请求体膨胀约 1/3，50MB 是稳定可用的最大值
#:   PUBLIC_BASE = ""            图片公开直链前缀，留空用 raw.githubusercontent.com
#:                               也可填 jsDelivr CDN，如 https://cdn.jsdelivr.net/gh/owner/repo@main
#:   ALLOWED_ORIGINS = ""        CORS 白名单，逗号分隔的具体域名；留空=仅同源（最严格）
#:   ACCESS_PASSWORD 不写这里！它是 Secret，见下方说明。
#: ─────────────────────────────────────────────────────────────
[vars]
# 图床文件直接存进项目本身，根目录为 gallery/（如 gallery/2026/11/<时间戳>.png）
REPO = "P4x1s/cloud-imagebed"
BRANCH = "main"
DIR_PREFIX = "gallery"
MAX_UPLOAD_MB = "50"
# 公开仓库可用 raw 直链预览；如需国内加速可改 jsDelivr：
# PUBLIC_BASE = "https://cdn.jsdelivr.net/gh/P4x1s/cloud-imagebed@main/gallery"
PUBLIC_BASE = ""
# CORS 严格白名单；PicGo 等桌面客户端不受浏览器 CORS 限制，留空即可
ALLOWED_ORIGINS = ""

#: ─────────────────────────────────────────────────────────────
#: Secret（不要写进本文件，用命令或 Dashboard 添加）：
#:   wrangler secret put GITHUB_TOKEN      # GitHub Personal Access Token
#:   wrangler secret put ACCESS_PASSWORD   # 前端访问口令
#: 本地开发则写进 .dev.vars（已被 .gitignore 忽略）。
#: ⚠️ 部署务必带 --keep-vars，否则 Dashboard 上的 Secret 会被清空。
#: ─────────────────────────────────────────────────────────────
